spring:
  application:
    name: fleet-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wms}
    username: ${DB_USERNAME:wms}
    password: ${DB_PASSWORD:wms}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8082}

security:
  jwt:
    issuer: ${JWT_ISSUER:infotact-fleet}
    secret: ${FLEET_JWT_SECRET:standalone-fleet-only-change-me-to-a-strong-32-byte-secret}
    expires-minutes: ${JWT_EXPIRES_MINUTES:480}

seed:
  admin-password: ${SEED_ADMIN_PASSWORD:admin123}
  dispatcher-password: ${SEED_DISPATCHER_PASSWORD:dispatcher123}
  operator-password: ${SEED_OPERATOR_PASSWORD:operator123}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:3000,http://127.0.0.1:5174}

fleet:
  osrm:
    base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    timeout-seconds: ${OSRM_TIMEOUT:10}
    max-waypoints: ${OSRM_MAX_WAYPOINTS:12}
  fuel-efficiency:
    diesel-km-per-liter: 8.0
    petrol-km-per-liter: 10.0
    electric-kwh-per-km: 0.2
    cng-kg-per-km: 0.25
